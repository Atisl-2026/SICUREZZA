plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.atisl2026.security'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.atisl2026.security'
        minSdk 21
        targetSdk 35
        // aumentare a ogni nuova versione dell'APK
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
